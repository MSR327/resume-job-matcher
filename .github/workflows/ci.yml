name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q   # no network, no models
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t jobmatch .
      # The image must run without PyTorch (ONNX only) and import the app's modules.
      - run: docker run --rm --entrypoint python jobmatch -c "import importlib.util as u, sys; sys.path.insert(0, 'src'); assert u.find_spec('torch') is None; import jobmatch.pipeline, jobmatch.embed, skillex.onnx_predict; print('ok: torch-free')"
